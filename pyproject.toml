[project]
name = "pitwall"
version = "0.1.0"
description = "F1 race strategy simulator: tyre degradation, Monte Carlo race simulation and strategy audits from public timing data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastf1>=3.5",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "plotly>=5.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "jupyterlab>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# pandas emits these while building synthetic Timedelta test data; not our code
filterwarnings = ["ignore:The 'generic' unit:DeprecationWarning"]

[tool.ruff]
line-length = 100
